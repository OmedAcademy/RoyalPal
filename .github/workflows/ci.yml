name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref — saves minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `next build` evaluates route modules while collecting page data, so the
    # public env vars must exist for the build to be deterministic. These are
    # syntactically valid placeholders — CI makes no network calls and no real
    # secret is needed to prove the app compiles.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The root Vitest workspace also runs mobile/lib/**/*.test.ts. Those
      # files sit under mobile/tsconfig.json, which extends expo/tsconfig.base.
      # Without this install, Vite fails resolving that extend and the suite
      # reports the mobile files as failed before any assertion runs.
      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Booking correctness is timezone-sensitive, and a host-timezone-dependent
      # bug already shipped once (offsets were measured by re-parsing localized
      # strings in the host zone). Running the suite under two zones keeps that
      # class of regression from returning unnoticed.
      - name: Test (TZ=UTC)
        run: npm run test
        env:
          TZ: UTC

      - name: Test (TZ=America/New_York)
        run: npm run test
        env:
          TZ: America/New_York

      - name: Build
        run: npm run build

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The same placeholders the build job uses. These tests deliberately cover
    # only the pages that render without a database — see playwright.config.ts
    # for why that scope is the point rather than a limitation.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Pinned by package-lock, so the browser build matches the runner exactly.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mobile:
    name: Mobile typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Without this job the Expo app can break — a renamed API field, a removed
    # export, a route that no longer compiles — while CI stays green, because
    # nothing else in this workflow looks inside mobile/.
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      # mobile/.npmrc sets legacy-peer-deps; see the comment there for why.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Syntactically real values, so the bundle exercises the actual inlining
      # path. The anon key is a valid-shaped JWT carrying role "anon" — which
      # is also what proves the secret scanner below passes the key that is
      # SUPPOSED to be there, rather than passing because nothing is.
      - name: Write placeholder public config
        run: |
          cat > .env <<'ENVEOF'
          EXPO_PUBLIC_API_URL=https://placeholder.royalpal.app
          EXPO_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder-signature-not-valid
          ENVEOF

      # A real Metro bundle for both platforms. This is what catches an import
      # that type-checks but cannot resolve at runtime, and a duplicate-React
      # regression in metro.config.js — neither of which tsc can see.
      - name: Bundle for iOS
        run: npx expo export --platform ios

      - name: Scan the iOS bundle for server secrets
        run: npm run check:secrets

      - name: Bundle for Android
        run: npx expo export --platform android

      - name: Scan the Android bundle for server secrets
        run: npm run check:secrets
